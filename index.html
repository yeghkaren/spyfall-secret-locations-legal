
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Spyfall - Legal & Support</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, sans-serif;
      background: #10131c;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 70px 24px;
      text-align: center;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: #252b3b;
      display: grid;
      place-items: center;
      font-size: 36px;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 8px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 44px;
      font-size: 15px;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 21px;
      background: #1c2230;
      border: 1px solid #303849;
      border-radius: 14px;
      text-decoration: none;
      color: #ffffff;
      text-align: left;
      transition: background 0.2s;
    }

    .link-card:hover {
      background: #293246;
    }

    .icon {
      font-size: 25px;
    }

    .link-text {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
    }

    .arrow {
      color: #9ca3af;
      font-size: 22px;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #858d9e;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main>
    <div class="logo" aria-hidden="true">🕵️</div>

    <h1>Spyfall: Secret Locations</h1>
    <p class="subtitle">Legal Information & Support</p>

    <nav class="links" aria-label="Legal and support pages">

      <a class="link-card" href="privacy-policy.html">
        <span class="icon" aria-hidden="true">🔒</span>
        <span class="link-text">Privacy Policy</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="link-card" href="terms-of-use.html">
        <span class="icon" aria-hidden="true">📄</span>
        <span class="link-text">Terms of Use</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="link-card" href="support.html">
        <span class="icon" aria-hidden="true">💬</span>
        <span class="link-text">Support</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

    </nav>
  </main>

  <footer>
    © 2026 Spyfall: Secret Locations. All rights reserved.
  </footer>

</body>
</html>
